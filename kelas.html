<!-- Template ini digunakan untuk demo.html dan kelas.html dengan sasaran berlainan. -->
<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AR Kata Kerja | Video Dalam AR</title>
<link rel="stylesheet" href="./style-video.css">
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body class="ar-page">
<!-- Gunakan video dalam DOM, bukan dalam a-assets, agar tidak menghalang kamera menunggu video preload. -->
<video id="videoAR" src="./video-kata-kerja.mp4" poster="./poster-video.jpg" playsinline webkit-playsinline preload="metadata" crossorigin="anonymous" style="position:fixed;top:-20px;left:-20px;width:1px;height:1px;opacity:0;pointer-events:none" aria-hidden="true"></video>
<a-scene embedded mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1;" color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-assets timeout="20000"><img id="gambarPoster" src="./poster-video.jpg" alt="Paparan awal video"></a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="kadAR" mindar-image-target="targetIndex: 0">
    <!-- Video dipautkan kepada image target, bukannya unsur 3D. -->
    <a-plane width="1.28" height=".79" position="0 .09 .065" color="#072a43" material="side: double; shader: flat;"></a-plane>
    <a-video id="arVideo" src="#videoAR" width="1.20" height=".669" position="0 .08 .084" visible="false" material="shader: flat; side: double;"></a-video>
    <a-image id="arPoster" src="#gambarPoster" width="1.20" height=".669" position="0 .08 .095" material="side: double; shader: flat;" visible="true"></a-image>
    <a-plane width="1.28" height=".07" position="0 -.337 .085" color="#23ba9a" material="shader: flat;"></a-plane>
    <a-text value="VIDEO BAHASA MELAYU" align="center" color="#092339" position="0 -.35 .1" width="1.1"></a-text>
  </a-entity>
</a-scene>
<div class="overlay">
<header class="topbar"><div class="brand">Cikgu AR · Video Bahasa Melayu<small>Imbas kad Bahasa Melayu anda</small></div><a href="./index.html" class="back">← Kembali</a></header>
<footer class="footer" aria-label="Kawalan video AR">
 <div class="status" id="status" aria-live="polite">Halakan kamera telefon kepada kad gambar…</div>
 <div class="progressline"><progress id="kemajuan" max="1000" value="0" aria-label="Kemajuan video"></progress><span id="masa">0:00 / 0:00</span></div>
 <div class="controls"><button id="btnMain" type="button" disabled>▶ Mainkan video</button><button id="btnUlang" type="button" disabled>↻ Ulang</button></div>
 <p class="notice">Audio dimainkan selepas anda menekan Mainkan video. Kekalkan kad dalam pandangan kamera.</p>
 <a class="altlink" href="./video-kata-kerja.mp4" target="_blank" rel="noopener">Jika video AR tak muncul, tonton video tanpa AR ↗</a>
</footer>
</div>
<script src="./video-ar.js" defer></script>
</body>
</html>
